name: Schema CI

# Applies docs/data-model/phase-1-schema.sql to a real PostGIS instance and
# asserts the compliance constraints actually hold.
#
# This is the ADR-0005 promise under test: compliance lives in the schema,
# not the UI. A rule enforced only in the client is not enforced. These
# assertions are compliance regression tests -- a failure here is a
# compliance regression, not a flaky test, and does not get skipped.
#
# Runs from day one: the schema and seed exist now, ahead of any app code.

on:
  push:
    branches: [main]
    paths:
      - 'docs/data-model/phase-1-schema.sql'
      - '.devcontainer/seed.sql'
      - 'tools/schema_assertions.sql'
      - '.github/workflows/schema-ci.yml'
  pull_request:
    paths:
      - 'docs/data-model/phase-1-schema.sql'
      - '.devcontainer/seed.sql'
      - 'tools/schema_assertions.sql'
      - '.github/workflows/schema-ci.yml'
  workflow_dispatch:

jobs:
  schema:
    name: Apply schema + compliance assertions
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sobkichu
          POSTGRES_PASSWORD: sobkichu
          POSTGRES_DB: sobkichu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sobkichu -d sobkichu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: sobkichu
      PGPASSWORD: sobkichu
      PGDATABASE: sobkichu_test

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply Phase 1 schema
        run: psql -v ON_ERROR_STOP=1 -q -f docs/data-model/phase-1-schema.sql

      - name: Verify PostGIS is available
        # The 1-10km radius discovery search depends on it; a Postgres image
        # without PostGIS would fail later and less clearly.
        run: psql -v ON_ERROR_STOP=1 -c "SELECT PostGIS_Version();"

      - name: Apply seed data
        run: psql -v ON_ERROR_STOP=1 -q -f .devcontainer/seed.sql

      - name: Seed is idempotent
        run: psql -v ON_ERROR_STOP=1 -q -f .devcontainer/seed.sql

      - name: Compliance + integrity assertions
        run: psql -v ON_ERROR_STOP=1 -f tools/schema_assertions.sql
