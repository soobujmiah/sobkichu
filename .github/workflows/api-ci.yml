name: API CI

# NestJS: lint -> typecheck -> unit -> integration against real
# PostgreSQL/PostGIS + Redis services.
#
# Master prompt Section 4: build/debug/test happen in GitHub Actions, not
# locally and not in an AI session sandbox. This is where a real build/test
# pass actually occurs.
#
# Skips cleanly until api/ exists, so it can be merged ahead of the codebase.

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-ci.yml']
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect API codebase
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f api/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::api/ not scaffolded yet — API CI is a no-op."
          fi

  static:
    name: Lint and typecheck
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    # Deliberately has no database services: formatting and type errors
    # should fail in seconds, not after a PostGIS container has booted.
    # Four of the first CI failures on this repo were Prettier nits paid for
    # at full pipeline cost.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect lockfile
        id: lock
        run: |
          if [ -f api/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.lock.outputs.present == 'true' && 'npm' || '' }}
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: |
          if [ "${{ steps.lock.outputs.present }}" = "true" ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Typecheck
        working-directory: api
        run: npx tsc --noEmit

  build:
    name: Test
    needs: [detect, static]
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sobkichu
          POSTGRES_PASSWORD: sobkichu
          POSTGRES_DB: sobkichu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sobkichu -d sobkichu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Secrets come from GitHub, never a committed .env (Section 4).
      DATABASE_URL: postgresql://sobkichu:sobkichu@localhost:5432/sobkichu_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # Test-only values. Real secrets come from GitHub Actions secrets
      # (Section 4); these exist so the auth code paths are exercisable.
      OTP_SECRET: ci-otp-secret
      SESSION_SECRET: ci-session-secret
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - name: Detect lockfile
        id: lock
        run: |
          if [ -f api/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No lockfile::api/package-lock.json is absent, so this run resolves dependencies fresh and is not reproducible. Commit a lockfile as soon as one is generated."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.lock.outputs.present == 'true' && 'npm' || '' }}
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        # npm ci requires a lockfile. Until one is committed, fall back to
        # npm install so CI is useful from the first commit -- with the
        # warning above making the reproducibility gap explicit.
        run: |
          if [ "${{ steps.lock.outputs.present }}" = "true" ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Apply Phase 1 schema and migrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f docs/data-model/phase-1-schema.sql
          for m in docs/data-model/migrations/*.sql; do
            echo "applying $m"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$m"
          done

      - name: Seed sample data
        # The integration tests read the seeded Dhaka fixtures.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f .devcontainer/seed.sql

      - name: Unit tests
        working-directory: api
        run: npm run test:unit -- --ci

      - name: Integration tests (real PostgreSQL + PostGIS)
        # Exercises adapters, the transaction boundary and the schema CHECK
        # constraints against a real database -- not fakes.
        working-directory: api
        run: npm run test:int -- --ci --runInBand

      - name: Compliance regression tests
        # These encode legal obligations (docs/compliance/compliance-matrix.md).
        # A failure here is a compliance regression, not a flaky test.
        #
        # Deliberately NOT --if-present: if the compliance script goes
        # missing, that must break the build rather than quietly pass.
        working-directory: api
        run: npm run test:compliance -- --ci
